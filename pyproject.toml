[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "aray-zomboid-translator"
version = "0.9.1"
description = "Auditoria e tradução local EN->PTBR para Project Zomboid B42"
requires-python = ">=3.10"
dependencies = ["Flask>=3.0,<4"]
[project.scripts]
arayzt = "arayzt.cli:main"
[tool.setuptools.packages.find]
include = ["arayzt*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
